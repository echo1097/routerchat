name: Build release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Test and package RouterChat
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.19"

      - name: Confirm the dependency lock is current
        run: |
          uv pip compile --universal --python-version 3.13 \
            --custom-compile-command "uv pip compile --universal --python-version 3.13 requirements.txt -o requirements.lock" \
            requirements.txt -o requirements.generated.lock
          diff --unified requirements.lock requirements.generated.lock

      - name: Create the test environment
        run: |
          python -m venv .venv
          uv pip sync --python .venv/bin/python requirements.lock

      - name: Test backend and package rules
        run: .venv/bin/python -m unittest discover -s tests -p "test_*.py"

      - name: Create release assets
        run: |
          .venv/bin/python scripts/package_release.py \
            --output-dir release \
            --expected-tag "${{ github.event.release.tag_name }}"

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/routerchat-app.zip \
            release/routerchat-app.zip.sha256 \
            --clobber
