<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; style-src file:; script-src file:"
    />
    <link rel="stylesheet" href="splash.css" />
    <title>RouterChat</title>
  </head>
  <body>
    <main class="splash">
      <div class="stage">
        <img
          class="logo"
          src="../../frontend/public/favicon/source-master-transparent-large-white.png"
          alt="RouterChat"
        />
      </div>

      <div class="loading">
        <div class="progressTrack">
          <div class="progressFill" id="progressFill"></div>
        </div>

        <p class="statusLine" id="statusLine"></p>
      </div>
    </main>

    <script src="sound/audioClock.js"></script>
    <script src="sound/lofiEngine.js"></script>
    <script src="sound/keys.js"></script>
    <script src="sound/thump.js"></script>
    <script src="sound/crackle.js"></script>
    <script src="sound/startupSounds.js"></script>
    <script src="intro.js"></script>
    <script src="splash.js"></script>
  </body>
</html>
